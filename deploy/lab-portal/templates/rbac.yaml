# The portal only reads and writes its own state ConfigMap (created by lab.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-portal.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-portal-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-portal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .Values.stateConfigMap | quote }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-portal-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-portal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-portal-state
subjects:
  - kind: ServiceAccount
    name: lab-portal
    namespace: {{ .Release.Namespace }}
